name: rainfall-verif
channels:
  - conda-forge
  - nodefaults          # do NOT append Anaconda's defaults channel:
                        # repo.anaconda.com now refuses non-interactive use until
                        # its Terms of Service are accepted (CondaToSNonInteractiveError),
                        # and its licence requires payment for larger organisations.
                        # Everything here lives on conda-forge anyway.
dependencies:
  - python>=3.10
  - streamlit>=1.30
  - plotly>=5.18
  - numpy>=1.24
  - scipy>=1.10
  - pandas>=2.0
  - xarray>=2023.1
  - netcdf4>=1.6
  - shapely>=2.0         # boundary/coastline clipping - imported directly by app.py
  - cartopy>=0.22        # coastline / boundary overlay
  - python-kaleido       # export figures to PNG/JPEG/SVG/PDF
  - cfgrib>=0.9          # GRIB2 reading
  - eccodes>=2.31        # GRIB backend
  - pip
  - pip:
      - firebase-admin>=6.5   # optional: Firestore audit
