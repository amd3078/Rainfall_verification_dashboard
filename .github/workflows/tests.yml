name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Check the application imports cleanly
        run: python -c "import app; print('import ok')"

      - name: Run the test suite
        run: pytest -q

      - name: Check the demo data loads
        run: python app.py --selftest

  security:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      # Audits the project's runtime dependencies for known CVEs.
      # --ignore-vuln for pip itself: it is the installer, not a shipped dependency.
      - name: Audit dependencies for known vulnerabilities
        run: pip-audit --progress-spinner off --skip-editable

  lint:
    name: syntax and import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      # Errors only (E9 syntax, F63/F7 bug-prone constructs, F82 undefined names).
      # Style is intentionally not enforced, to avoid churn in the existing code.
      - name: Check for syntax errors and undefined names
        run: ruff check --select E9,F63,F7,F82 .
